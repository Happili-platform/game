<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password · GAMe</title><link rel="stylesheet" href="/static/style.css?v=0.3.5"></head>
<body class="auth-page"><main class="auth-card"><div class="auth-brand"><span class="brand-icon">G<span>✦</span></span><div>GAMe<small>GOVERNANCE AND AGENT MANAGEMENT for Enterprise</small></div></div>
<p class="eyebrow auth-company-name" id="companyAccessLabel">Company Access · Account Security</p><h1>Change password</h1><p class="muted" id="passwordIntro">Choose a unique password of at least 15 characters. You'll sign in again afterward.</p>
<form id="changeForm" class="auth-form"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label>
<label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="15" required></label>
<label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="15" required></label>
<button type="submit" class="primary-btn" id="submitPassword">Save password</button><div class="error" role="alert" id="passwordError"></div></form>
<button type="button" class="secondary-btn auth-signout" id="passwordSignout">Sign out</button>
<p class="auth-note">Supported by Happili Platform. <a href="https://github.com/Happili-platform/game" target="_blank" rel="noopener noreferrer">Source code (AGPLv3)</a></p>
</main><script>
fetch('/api/branding',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
 if(d?.company_name)document.querySelector('#companyAccessLabel').textContent=`${d.company_name} Access · Account Security`;
}).catch(()=>{});
let csrf='';fetch('/api/auth/session').then(async r=>{if(!r.ok){location.replace('/login');return;}const d=await r.json();csrf=d.csrf_token;if(d.must_change_password)document.querySelector('#passwordIntro').textContent='Your administrator requires you to change your initial password. Use at least 15 characters.';});
document.querySelector('#changeForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,err=document.querySelector('#passwordError'),btn=document.querySelector('#submitPassword');err.textContent='';
if(f.new_password.value!==f.confirm_password.value){err.textContent='Passwords do not match';return;}btn.disabled=true;
try{const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({current_password:f.current_password.value,new_password:f.new_password.value})});
const d=await r.json();if(!r.ok)throw new Error(d.detail||'Unable to change password');f.reset();location.replace('/login');}
catch(x){err.textContent=x.message;btn.disabled=false;}});
document.querySelector('#passwordSignout').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST',headers:{'X-CSRF-Token':csrf}});location.replace('/login');});
</script></body></html>
